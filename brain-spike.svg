<!-- [2026-08-04] [SVG, Stitch-Bro, O(1), Animated Icon] - Organized by Gemini -->
<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes brainPulse {
      0%, 90%, 100% { transform: scale(1); stroke: #8a2be2; }
      95% { transform: scale(1.1); stroke: #00ffcc; }
    }
    @keyframes spike {
      0%, 90%, 100% { stroke-dasharray: 0 150; stroke-dashoffset: 0; stroke: #00ffcc; }
      92% { stroke-dasharray: 50 150; stroke-dashoffset: -20; stroke: #ffffff; }
      98% { stroke-dasharray: 0 150; stroke-dashoffset: -150; stroke: #00ffcc; }
    }
    .brain {
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: brainPulse 2s infinite;
      transform-origin: 50px 50px;
    }
    .ekg {
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: spike 2s infinite;
    }
  </style>
  <rect width="100%" height="100%" fill="#030610"/>
  <g class="brain">
    <path d="M50 20 C30 20, 20 40, 25 55 C20 70, 40 80, 50 75 C60 80, 80 70, 75 55 C80 40, 70 20, 50 20 Z" />
    <path d="M50 20 L50 75" stroke-dasharray="2 4" />
    <path d="M35 35 Q50 45 65 35" />
    <path d="M30 55 Q50 65 70 55" />
  </g>
  <path class="ekg" d="M10 50 L35 50 L45 20 L55 80 L65 50 L90 50" />
</svg>
