<!-- [2026-08-04] [SVG, Stitch-Bro, O(1), Animated Icon] - Organized by Gemini -->
<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes scan {
      0% { transform: translateY(-10px); }
      50% { transform: translateY(110px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes pulseGlow {
      0%, 100% { stroke: #00a8ff; }
      50% { stroke: #00ffcc; }
    }
    .fingerprint {
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      animation: pulseGlow 2s infinite;
    }
    .scanner {
      animation: scan 3s linear infinite;
    }
  </style>
  <rect width="100%" height="100%" fill="#030610"/>
  <g class="fingerprint">
    <path d="M30 50 Q50 30 70 50" />
    <path d="M25 60 Q50 20 75 60" />
    <path d="M20 70 Q50 10 80 70" />
    <path d="M35 70 Q50 40 65 70" />
    <path d="M40 80 Q50 50 60 80" />
    <path d="M45 90 Q50 70 55 90" />
    <path d="M50 35 L50 65" stroke-dasharray="2 4" />
  </g>
  <line x1="0" y1="0" x2="100" y2="0" stroke="#39ff14" stroke-width="2" class="scanner" />
  <rect x="0" y="-10" width="100" height="10" fill="url(#grad)" class="scanner" opacity="0.5"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0" />
      <stop offset="100%" stop-color="#39ff14" stop-opacity="1" />
    </linearGradient>
  </defs>
</svg>
