<!-- [2026-08-04] [SVG, Stitch-Bro, O(1), Animated Icon] - Organized by Gemini -->
<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #050508; }
  .bracket { stroke: #00ffff; stroke-width: 2; fill: none; stroke-linecap: square; animation: expand 2s infinite alternate; }
  .bracket-inner { stroke: #ff00ff; stroke-width: 1.5; fill: none; stroke-linecap: square; stroke-dasharray: 4 4; opacity: 0.6; }
  @keyframes expand { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
</style>
<rect class="bg" width="100" height="100" />
<g transform-origin="50 50">
  <!-- TL -->
  <polyline class="bracket" points="30,20 20,20 20,30" />
  <polyline class="bracket-inner" points="35,25 25,25 25,35" />
  <!-- TR -->
  <polyline class="bracket" points="70,20 80,20 80,30" />
  <polyline class="bracket-inner" points="65,25 75,25 75,35" />
  <!-- BL -->
  <polyline class="bracket" points="30,80 20,80 20,70" />
  <polyline class="bracket-inner" points="35,75 25,75 25,65" />
  <!-- BR -->
  <polyline class="bracket" points="70,80 80,80 80,70" />
  <polyline class="bracket-inner" points="65,75 75,75 75,65" />
</g>
<circle cx="50" cy="50" r="3" fill="#00ffff" opacity="0.8" />
</svg>
