<!-- [2026-08-04] [SVG, Stitch-Bro, O(1), Animated Icon] - Organized by Gemini -->
<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<style>
  .core { stroke: #00ffff; stroke-width: 1.5; fill: none; animation: spin 8s linear infinite; transform-origin: 50px 50px; }
  .pulse { stroke: #ff00ff; stroke-width: 2; fill: none; animation: pulse 2s ease-in-out infinite alternate; stroke-dasharray: 4 4; transform-origin: 50px 50px; }
  .bg { fill: #050508; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1.05); } }
</style>
<rect class="bg" width="100" height="100" />
<circle class="pulse" cx="50" cy="50" r="20" />
<circle cx="50" cy="50" r="10" fill="#00ffff" opacity="0.8" />
<g class="core">
  <ellipse cx="50" cy="50" rx="40" ry="10" />
  <ellipse cx="50" cy="50" rx="40" ry="10" transform="rotate(60 50 50)" />
  <ellipse cx="50" cy="50" rx="40" ry="10" transform="rotate(120 50 50)" />
</g>
</svg>
