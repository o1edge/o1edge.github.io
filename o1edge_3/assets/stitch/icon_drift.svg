<!-- [2026-08-04] [SVG, Stitch-Bro, O(1), Animated Icon] - Organized by Gemini -->
<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #050508; }
  .delta { stroke: #00ffff; stroke-width: 2; fill: none; stroke-linejoin: round; animation: float 4s ease-in-out infinite; }
  .shadow { stroke: #ff00ff; stroke-width: 1.5; fill: none; stroke-linejoin: round; stroke-dasharray: 2 4; animation: drift 4s ease-in-out infinite; }
  @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0); } }
  @keyframes drift { 0% { transform: translate(0, 0); opacity: 1; } 50% { transform: translate(6px, -10px); opacity: 0.3; } 100% { transform: translate(0, 0); opacity: 1; } }
</style>
<rect class="bg" width="100" height="100" />
<polygon class="shadow" points="50,25 20,80 80,80" />
<polygon class="delta" points="50,25 20,80 80,80" />
<line x1="40" y1="65" x2="60" y2="65" stroke="#00ffff" stroke-width="1.5" />
</svg>
