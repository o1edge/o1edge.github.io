<!-- [2026-08-04] [SVG, Stitch-Bro, O(1), Animated Icon] - Organized by Gemini -->
<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #050508; }
  .grid { stroke: #00ffff; stroke-width: 1.5; opacity: 0.4; }
  .tensor { stroke: #ff00ff; stroke-width: 2; fill: none; animation: spin-tensor 6s linear infinite; transform-origin: 50px 50px; }
  .node { fill: #00ffff; animation: blink 2s infinite alternate; }
  @keyframes spin-tensor { 0% { transform: rotate(0deg); } 100% { transform: rotate(90deg); } }
  @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }
</style>
<rect class="bg" width="100" height="100" />
<!-- Base Grid -->
<path class="grid" d="M 20 50 L 80 50 M 50 20 L 50 80 M 30 30 L 70 70 M 30 70 L 70 30" />
<!-- Spinning Tensor Connections -->
<g class="tensor">
  <rect x="35" y="35" width="30" height="30" />
  <circle cx="50" cy="50" r="15" stroke-dasharray="4 4" />
</g>
<!-- Nodes -->
<circle class="node" cx="50" cy="20" r="3" style="animation-delay: 0s;" />
<circle class="node" cx="50" cy="80" r="3" style="animation-delay: 0.5s;" />
<circle class="node" cx="20" cy="50" r="3" style="animation-delay: 1s;" />
<circle class="node" cx="80" cy="50" r="3" style="animation-delay: 1.5s;" />
<circle class="node" cx="50" cy="50" r="4" fill="#ff00ff" />
</svg>
