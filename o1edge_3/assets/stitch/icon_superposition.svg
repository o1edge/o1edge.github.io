<!-- [2026-08-04] [SVG, Stitch-Bro, O(1), Animated Icon] - Organized by Gemini -->
<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #050508; }
  .wave1 { stroke: #00ffff; stroke-width: 1.5; fill: none; animation: shift 3s ease-in-out infinite alternate; }
  .wave2 { stroke: #ff00ff; stroke-width: 2; fill: none; stroke-dasharray: 2 4; animation: shift-inv 3s ease-in-out infinite alternate; }
  @keyframes shift { 0% { transform: translateY(-5px); } 100% { transform: translateY(5px); } }
  @keyframes shift-inv { 0% { transform: translateY(5px); } 100% { transform: translateY(-5px); } }
</style>
<rect class="bg" width="100" height="100" />
<path class="wave1" d="M 10 50 Q 30 20 50 50 T 90 50" />
<path class="wave2" d="M 10 50 Q 30 80 50 50 T 90 50" />
<circle cx="50" cy="50" r="4" fill="#00ffff" />
</svg>
